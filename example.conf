# The tunnel takes its name from the file name (example.conf -> "example").
# [Interface] and [Peer] are standard WireGuard; paste them from the
# WireGuard app (Export tunnels to zip) or from your server.

[Interface]
PrivateKey = <your private key>
Address = 10.8.0.2/32
# With DNS set, the whole system resolves names through these servers over
# the tunnel, and other DNS servers are blocked (StrictDNS).
DNS = 10.8.0.1

[Peer]
PublicKey = <server public key>
Endpoint = home.example.net:51820
# A default route here carries listed apps' internet traffic in include
# mode. Specific ranges, such as the home LAN, are routed for every app.
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25

[Splitwire]
# full    route by AllowedIPs, like the WireGuard app (default)
# include only the listed apps use the tunnel
# exclude everything except the listed apps uses the tunnel
Mode = include

# One App per line: an absolute path, %VARIABLES% and * ? globs allowed.
# Child processes inherit the setting, so a launcher covers its games.
App = C:\Program Files\Mozilla Firefox\firefox.exe
App = %LOCALAPPDATA%\Discord\app-*\Discord.exe

# Full and exclude modes: block traffic outside the tunnel.
# auto = on when AllowedIPs has a default route.
KillSwitch = auto
# Exempt private networks from the kill switch.
AllowLAN = off
# Block DNS servers other than [Interface] DNS.
StrictDNS = on
